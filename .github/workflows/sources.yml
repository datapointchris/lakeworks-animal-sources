# Repo-specific, beside the generated validate.yml. A malformed spec would otherwise surface
# inside a Glue job — minutes into a run, as a KeyError naming a dictionary rather than a file.
name: Sources

on:
  push:
    branches: [main]
  pull_request:

jobs:
  specs:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - run: uv run --with pyyaml python validate_sources.py
